<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Preventista — Todo Golosina</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
:root{--blue:#009EE3;--dark:#2D3277;--green:#25D366;--amber:#f59e0b;--bg:#f1f5f9;--card:#fff;--border:#e2e8f0;--muted:#94a3b8;--text:#1e293b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);font-family:-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--text);overflow-x:hidden}

/* ── HEADER STICKY ── */
.hdr{position:sticky;top:0;z-index:200;background:linear-gradient(135deg,var(--dark),var(--blue));color:#fff;padding:10px 14px;box-shadow:0 2px 12px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:space-between;min-height:56px}
.hdr-info h6{margin:0;font-size:.68rem;opacity:.6;letter-spacing:.03em}.hdr-info .cli{font-size:.92rem;font-weight:700}
.hdr-btn{min-width:48px;min-height:48px;border-radius:12px;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:1.1rem;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(4px)}
.hdr-btn:active{background:rgba(255,255,255,.3)}

/* ── BUSCADOR STICKY ── */
.srch{position:sticky;top:56px;z-index:150;background:var(--card);border-bottom:1px solid var(--border);padding:8px 12px}
.srch input{width:100%;border:1.5px solid var(--border);border-radius:12px;padding:12px 14px 12px 40px;font-size:.9rem;outline:none;background:var(--bg);transition:border .2s}
.srch input:focus{border-color:var(--blue)}
.srch i{position:absolute;left:24px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:1rem}
.srch-wrap{position:relative}

/* ── LISTA PRODUCTOS ── */
.list{padding:6px 10px 140px}
.item{background:var(--card);border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.05);margin-bottom:8px;display:flex;align-items:center;gap:10px;padding:8px 10px;min-height:64px;transition:box-shadow .15s}
.item:active{box-shadow:0 0 0 2px var(--blue)}
.item-img{width:52px;height:52px;border-radius:10px;flex-shrink:0;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:1.6rem;overflow:hidden}
.item-img img{width:52px;height:52px;object-fit:cover;border-radius:10px}
.item-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.item-cat{font-size:.6rem;text-transform:uppercase;color:var(--muted);letter-spacing:.04em;font-weight:600}
.item-name{font-size:.84rem;font-weight:700;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.item-price{font-size:.88rem;color:var(--blue);font-weight:800}
.item-tag{font-size:.55rem;background:linear-gradient(90deg,var(--blue),#0070b8);color:#fff;border-radius:99px;padding:2px 6px;font-weight:700}
.item-actions{display:flex;align-items:center;gap:5px;flex-shrink:0}
.qty-in{width:48px;height:48px;border:2px solid var(--border);border-radius:12px;text-align:center;font-weight:800;font-size:1rem;background:var(--bg);color:var(--text);outline:none;-moz-appearance:textfield}
.qty-in::-webkit-inner-spin-button,.qty-in::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.qty-in:focus{border-color:var(--blue);background:#fff}
.btn-add{min-width:48px;height:48px;border-radius:12px;background:var(--blue);color:#fff;border:none;font-size:1.15rem;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;font-weight:700}
.btn-add:active{transform:scale(.93)}.btn-add:disabled{background:#cbd5e1;cursor:not-allowed}
.btn-add.ok{background:#10b981}

/* ── FAB CARRITO ── */
.fab{position:fixed;bottom:20px;right:16px;z-index:300;display:none;align-items:center;gap:8px;background:var(--green);color:#fff;border:none;border-radius:50px;padding:14px 20px;font-weight:800;font-size:.9rem;box-shadow:0 6px 24px rgba(37,211,102,.5);cursor:pointer;min-height:56px;transition:transform .15s}
.fab:active{transform:scale(.95)}
.fab .badge{background:#fff;color:var(--dark);font-size:.72rem;border-radius:99px;padding:3px 8px;font-weight:800}
.fab-secondary{position:fixed;bottom:20px;left:16px;z-index:300;display:none;align-items:center;gap:6px;background:var(--dark);color:#fff;border:none;border-radius:50px;padding:12px 16px;font-weight:700;font-size:.8rem;box-shadow:0 4px 16px rgba(45,50,119,.4);cursor:pointer;min-height:48px}

/* ── MODAL CLIENTES ── */
.overlay{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:420px;max-height:85vh;display:flex;flex-direction:column;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-hdr{padding:16px 18px 8px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sheet-hdr h6{margin:0;font-weight:800;font-size:1rem}
.sheet-body{padding:10px 16px;overflow-y:auto;flex:1}
.cli-search{width:100%;border:2px solid var(--border);border-radius:12px;padding:12px 14px;font-size:.9rem;outline:none;margin-bottom:10px}
.cli-search:focus{border-color:var(--blue)}
.cli-item{padding:14px 12px;border-radius:12px;cursor:pointer;border-bottom:1px solid #f8fafc;display:flex;align-items:center;gap:10px;min-height:52px;transition:background .1s}
.cli-item:active,.cli-item:hover{background:#f0f9ff}
.cli-item .avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--dark));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.9rem;flex-shrink:0}
.cli-item-info{flex:1;min-width:0}.cli-item-info strong{display:block;font-size:.88rem}.cli-item-info small{color:var(--muted);font-size:.75rem}
.new-cli{background:var(--bg);border-radius:14px;padding:14px;margin-top:10px}
.new-cli input{width:100%;border:2px solid var(--border);border-radius:10px;padding:11px 12px;font-size:.88rem;outline:none;margin-bottom:6px}
.new-cli input:focus{border-color:var(--blue)}
.new-cli button{width:100%;min-height:48px;border-radius:12px;background:var(--blue);color:#fff;border:none;font-weight:700;font-size:.9rem;cursor:pointer;margin-top:4px}

/* ── OFFCANVAS CARRITO ── */
.cart-overlay{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.5);display:none}
.cart-overlay.show{display:block}
.cart-panel{position:fixed;bottom:0;left:0;right:0;z-index:501;background:#fff;border-radius:20px 20px 0 0;max-height:85vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s ease;max-width:450px !important;margin:0 auto !important;box-shadow:0 -10px 40px rgba(0,0,0,0.2)}
.cart-panel.show{transform:translateY(0)}
.cart-hdr{padding:14px 18px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.cart-hdr h6{margin:0;font-weight:800;font-size:1rem}
.cart-body{padding:8px 16px;overflow-y:auto;flex:1}
.cart-footer{padding:12px 16px;border-top:1px solid var(--border);background:#fafbfc}
.ci{display:flex !important;justify-content:space-between !important;align-items:center !important;padding:10px 0 !important;border-bottom:1px solid #eee !important;min-height:50px;background:transparent !important}
.ci:nth-child(even){background:rgba(0,0,0,0.02) !important}
.ci:last-child{border-bottom:none !important}
.ci-name{max-width:60% !important;font-size:.85rem;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.2}
.ci-qty{width:48px;height:40px;border:1.5px solid var(--border);border-radius:10px;text-align:center;font-weight:800;font-size:.9rem;outline:none;-moz-appearance:textfield;background:var(--bg)}
.ci-qty::-webkit-inner-spin-button,.ci-qty::-webkit-outer-spin-button{-webkit-appearance:none}
.ci-qty:focus{border-color:var(--blue);background:#fff}
.ci-sub{font-size:.9rem;font-weight:800;color:var(--blue);white-space:nowrap;min-width:70px;text-align:right}
.ci-del{min-width:40px;height:40px;border-radius:10px;background:rgba(239,68,68,.1);border:none;color:#ef4444;font-size:1rem;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ci-del:active{background:rgba(239,68,68,.2)}
.btn-wsp{width:100%;min-height:56px;border-radius:30px;background:var(--green);color:#fff;border:none;font-weight:800;font-size:1.05rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px;box-shadow:0 4px 16px rgba(37,211,102,0.3)}
.btn-wsp:active{transform:scale(.97)}
.total-box{background:#fff;border:2px solid var(--blue);border-radius:20px;padding:18px;margin:10px 0 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 15px rgba(0,158,227,0.1)}
.btn-clear{width:100%;min-height:44px;border-radius:12px;background:transparent;border:1.5px solid var(--border);color:var(--muted);font-weight:600;font-size:.85rem;cursor:pointer}
.empty{text-align:center;padding:2rem 1rem;color:var(--muted);font-size:.9rem}
.desc-badge{font-size:.58rem;background:var(--blue);color:#fff;border-radius:99px;padding:2px 5px;font-weight:700;margin-left:4px}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-info">
    <h6>🍬 TODO GOLOSINA — PREVENTISTA</h6>
    <div class="cli" id="cliBanner"><i class="bi bi-person-circle"></i> Seleccioná un cliente</div>
  </div>
  <div style="display:flex; gap:8px">
    <button class="hdr-btn" onclick="abrirClientes()" aria-label="Cambiar cliente"><i class="bi bi-people-fill"></i></button>
    <a href="{{ url_for('logout') }}" class="hdr-btn" style="color:#ff6b6b; font-size:1.2rem" title="Cerrar Sesión"><i class="bi bi-box-arrow-right"></i></a>
  </div>
</div>

<!-- BUSCADOR -->
<div class="srch">
  <div class="srch-wrap">
    <i class="bi bi-search"></i>
    <input type="search" id="buscProd" placeholder="Buscar producto..." oninput="filtrar(this.value)" inputmode="search">
  </div>
</div>

<!-- LISTA -->
<div class="list" id="grid"></div>

<!-- FAB CARRITO (WhatsApp) -->
<button class="fab" id="fab" onclick="abrirCart()">
  <i class="bi bi-whatsapp" style="font-size:1.2rem"></i>
  Enviar pedido
  <span class="badge" id="fabN">0</span>
</button>

<!-- FAB VER CARRITO -->
<button class="fab-secondary" id="fabCart" onclick="abrirCart()">
  <i class="bi bi-cart3"></i>
  <span id="fabT">$0</span>
</button>

<!-- MODAL CLIENTES (Bottom Sheet) -->
<div class="overlay" id="cliOverlay" onclick="if(event.target===this&&cli)cerrarClientes()">
  <div class="sheet">
    <div class="sheet-hdr">
      <h6><i class="bi bi-person-check" style="color:var(--blue)"></i> Elegir cliente</h6>
      <button class="hdr-btn" style="min-width:40px;min-height:40px;background:var(--bg);color:var(--text);font-size:.9rem" onclick="if(cli)cerrarClientes()" id="btnCerrarCli"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="sheet-body">
      <input type="search" class="cli-search" id="buscCli" placeholder="Buscar cliente..." oninput="buscarCli(this.value)" inputmode="search">
      <div id="listaCli"></div>
      <div class="new-cli">
        <strong style="font-size:.8rem;color:var(--muted);display:block;margin-bottom:6px">➕ Registrar nuevo cliente</strong>
        <input type="text" id="ncNom" placeholder="Nombre del cliente *">
        <input type="tel" id="ncTel" placeholder="Teléfono (opcional)" inputmode="tel">
        <input type="text" id="ncDir" placeholder="Dirección (opcional)">
        <button onclick="crearCli()"><i class="bi bi-person-plus me-1"></i>Crear y Seleccionar</button>
      </div>
    </div>
  </div>
</div>

<!-- PANEL CARRITO (Bottom Sheet) -->
<div class="cart-overlay" id="cartOvl" onclick="if(event.target===this)cerrarCart()"></div>
<div class="cart-panel" id="cartPanel">
  <div class="cart-hdr" style="position: relative;">
    <h6 style="margin: 0;"><i class="bi bi-cart3"></i> Resumen de Venta</h6>
    <button class="hdr-btn" style="position: absolute; right: 10px; top: 8px; min-width:40px;min-height:40px;background:var(--bg);color:var(--text);font-size:.9rem" onclick="cerrarCart()"><i class="bi bi-x-lg"></i></button>
  </div>
  <div class="cart-body" id="cartB"></div>
  <div class="cart-footer" id="cartF"></div>
</div>

<script>
let prods=[],cart=[],cli=null;

document.addEventListener('DOMContentLoaded',()=>{
  abrirClientes();buscarCli('');fetchProds();
});

// ═══ CLIENTES ═══
function abrirClientes(){document.getElementById('cliOverlay').classList.add('show');document.getElementById('buscCli').focus()}
function cerrarClientes(){document.getElementById('cliOverlay').classList.remove('show')}

async function buscarCli(q){
  try{
    const r=await fetch('/api/clientes?q='+encodeURIComponent(q));const d=await r.json();
    const el=document.getElementById('listaCli');
    if(!d.clientes?.length){el.innerHTML='<div class="empty">Sin resultados. Creá un cliente nuevo abajo 👇</div>';return}
    el.innerHTML=d.clientes.map(c=>{
      const ini=c.nombre.charAt(0).toUpperCase();
      return `<div class="cli-item" onclick="selCli(${c.id},\`${c.nombre.replace(/`/g,'')}\`,\`${(c.telefono||'').replace(/`/g,'')}\`)">
        <div class="avatar">${ini}</div>
        <div class="cli-item-info"><strong>${c.nombre}</strong>${c.telefono?`<small><i class="bi bi-telephone"></i> ${c.telefono}</small>`:''}</div>
      </div>`}).join('');
  }catch(e){console.error(e)}
}

function selCli(id,n,t){
  cli={id,nombre:n,telefono:t};
  document.getElementById('cliBanner').innerHTML=`<i class="bi bi-person-check-fill"></i> Vendiendo a: <strong>${n}</strong>`;
  cerrarClientes();renderGrid(prods);
}

async function crearCli(){
  const n=document.getElementById('ncNom').value.trim();
  if(!n){alert('Ingresá el nombre del cliente');return}
  const body={nombre:n,telefono:document.getElementById('ncTel').value.trim(),direccion:document.getElementById('ncDir').value.trim()};
  const r=await fetch('/api/clientes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json();
  if(d.ok){selCli(d.cliente.id,d.cliente.nombre,d.cliente.telefono);['ncNom','ncTel','ncDir'].forEach(x=>document.getElementById(x).value='')}
}

// ═══ PRODUCTOS ═══
async function fetchProds(){
  try{const r=await fetch('/api/productos');const d=await r.json();prods=d.productos||[]}catch(e){prods=[]}
  renderGrid(prods);
}

function filtrar(q){q=q.toLowerCase().trim();renderGrid(prods.filter(p=>p.nombre.toLowerCase().includes(q)||(p.descripcion||'').toLowerCase().includes(q)))}

function renderGrid(list){
  const g=document.getElementById('grid');
  if(!list.length){g.innerHTML='<div class="empty">🔍 Sin productos</div>';return}
  g.innerHTML=list.map(p=>{
    const img=(p.imagen&&(p.imagen.startsWith('http')||p.imagen.startsWith('/static/')))?`<img src="${p.imagen}" onerror="this.parentElement.textContent='🍬'">`:'🍬';
    const pr=Number(p.precio).toLocaleString('es-AR');
    const tag=(p.descuento_volumen_activo&&p.cantidad_minima_descuento&&p.porcentaje_descuento_volumen)?`<span class="item-tag">x${p.cantidad_minima_descuento}+ → ${Math.round(p.porcentaje_descuento_volumen)}%</span>`:'';
    const off=(p.stock<=0&&!p.permitir_sin_stock);const dis=(!cli||off)?'disabled':'';
    return `<div class="item">
      <div class="item-img">${img}</div>
      <div class="item-body">
        <span class="item-cat">${p.categoria||''}</span>
        <p class="item-name">${p.nombre}</p>
        <div class="item-meta"><span class="item-price">$${pr}</span>${tag}</div>
      </div>
      <div class="item-actions">
        <input type="number" class="qty-in" value="1" min="1" ${(!p.permitir_sin_stock&&p.stock>0)?`max="${p.stock}"`:''}inputmode="numeric" pattern="[0-9]*" id="qi${p.id}" ${dis}>
        <button class="btn-add" id="qb${p.id}" ${dis} onclick="agregar(${p.id},\`${p.nombre.replace(/`/g,'')}\`,${p.precio},${p.stock||0},${p.permitir_sin_stock?1:0},${p.descuento_volumen_activo?1:0},${p.cantidad_minima_descuento||0},${p.porcentaje_descuento_volumen||0})" aria-label="Agregar">
          ${off?'<i class="bi bi-x-lg"></i>':'<i class="bi bi-plus-lg"></i>'}
        </button>
      </div>
    </div>`}).join('');
}

// ═══ CARRITO ═══
function ep(i){return(i.da&&i.dm&&i.dp&&i.qty>=i.dm)?i.price*(1-i.dp/100):i.price}

function agregar(id,name,price,stock,pss,da,dm,dp){
  if(!cli){abrirClientes();return}
  const inp=document.getElementById('qi'+id);const qty=Math.max(1,parseInt(inp?.value)||1);
  const ex=cart.find(x=>x.id===id);
  if(ex){ex.qty+=qty}else{cart.push({id,name,price,stock,pss:!!pss,da:!!da,dm,dp,qty})}
  if(inp)inp.value=1;
  const b=document.getElementById('qb'+id);
  if(b){b.innerHTML='<i class="bi bi-check-lg"></i>';b.classList.add('ok');setTimeout(()=>{b.innerHTML='<i class="bi bi-plus-lg"></i>';b.classList.remove('ok')},1000)}
  updFab();
}

function setQ(id,v){const i=cart.find(x=>x.id===id);if(!i)return;v=parseInt(v);if(isNaN(v)||v<1)return;i.qty=v;updFab();updCartPrices()}
function del(id){cart=cart.filter(x=>x.id!==id);updFab();renderCart()}
function vaciar(){if(!confirm('¿Vaciar pedido?'))return;cart=[];updFab();renderCart()}

function updFab(){
  const tot=cart.reduce((a,p)=>a+ep(p)*p.qty,0);const n=cart.reduce((a,p)=>a+p.qty,0);
  const fab=document.getElementById('fab'),fc=document.getElementById('fabCart');
  if(!cart.length){fab.style.display='none';fc.style.display='none';return}
  fab.style.display='flex';fc.style.display='flex';
  document.getElementById('fabN').textContent=n;
  document.getElementById('fabT').textContent='$'+tot.toLocaleString('es-AR');
}

function abrirCart(){renderCart();document.getElementById('cartOvl').classList.add('show');document.getElementById('cartPanel').classList.add('show')}
function cerrarCart(){document.getElementById('cartOvl').classList.remove('show');document.getElementById('cartPanel').classList.remove('show')}

function renderCart(){
  const b=document.getElementById('cartB'),f=document.getElementById('cartF');
  if(!cart.length){b.innerHTML='<div class="empty">Pedido vacío</div>';f.innerHTML='';return}
  const tot=cart.reduce((a,p)=>a+ep(p)*p.qty,0);
  b.innerHTML=cart.map(p=>{
    const s=(ep(p)*p.qty).toLocaleString('es-AR');
    const dc=(p.da&&p.dm&&p.dp&&p.qty>=p.dm)?`<span class="desc-badge">🎉${Math.round(p.dp)}%</span>`:'';
    return `<div class="ci">
      <div style="max-width:60%; flex-shrink:0;">
        <span class="ci-name">${p.name}${dc}</span>
      </div>
      <div style="display:flex; align-items:center; gap:8px; flex:1; justify-content:flex-end;">
        <div style="display:flex; align-items:center; gap:2px">
          <small class="text-muted" style="font-weight:700">x</small>
          <input type="number" class="ci-qty" value="${p.qty}" min="1" inputmode="numeric" pattern="[0-9]*" id="cq${p.id}" oninput="setQ(${p.id},this.value)" onblur="if(!this.value||this.value<1){this.value=1;setQ(${p.id},1)}" style="width:40px; height:35px;">
        </div>
        <span class="ci-sub" id="cs${p.id}" style="font-size:0.85rem; font-weight:800; min-width:65px; text-align:right;">$${s}</span>
        <button class="ci-del" onclick="del(${p.id})" aria-label="Eliminar" style="min-width:35px; height:35px;"><i class="bi bi-trash3" style="font-size:0.9rem"></i></button>
      </div>
    </div>`
  }).join('');
  f.innerHTML=`<div class="total-box">
      <span style="font-weight:700;font-size:1rem;color:var(--dark)">Total del Pedido</span>
      <span style="font-weight:900;font-size:1.4rem;color:var(--blue)" id="cartTot">$${tot.toLocaleString('es-AR')}</span>
    </div>
    <button class="btn-wsp" onclick="finalizar()"><i class="bi bi-whatsapp" style="font-size:1.2rem"></i>Finalizar y enviar por WhatsApp</button>
    <button class="btn-clear" onclick="vaciar()">Vaciar pedido</button>`;
}

function updCartPrices(){
  cart.forEach(p=>{const el=document.getElementById('cs'+p.id);if(el)el.textContent='$'+(ep(p)*p.qty).toLocaleString('es-AR')});
  const tot=cart.reduce((a,p)=>a+ep(p)*p.qty,0);
  const tEl=document.getElementById('cartTot');if(tEl)tEl.textContent='$'+tot.toLocaleString('es-AR');
}

async function finalizar(){
  if(!cli){alert('Seleccioná un cliente');return}if(!cart.length){alert('Pedido vacío');return}
  const tot=cart.reduce((a,p)=>a+ep(p)*p.qty,0);
  const det=cart.map(p=>({nombre:p.name,qty:p.qty,precio_unit:ep(p),subtotal:ep(p)*p.qty}));
  try{await fetch('/api/registrar_venta',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cliente_id:cli.id,items:cart.map(p=>({id:p.id,qty:p.qty})),total:tot,detalle:det})})}catch(e){console.error(e)}
  const lineas=cart.map(p=>{const s=(ep(p)*p.qty).toLocaleString('es-AR');const di=(p.da&&p.dm&&p.dp&&p.qty>=p.dm)?` 🎉${Math.round(p.dp)}%desc.`:'';return `• ${p.name} x${p.qty}${di} → $${s}`}).join('\n');
  const msg=`🍬 *Todo Golosina — Pedido*\n👤 Cliente: *${cli.nombre}*\n\n${lineas}\n\n💰 *Total: $${tot.toLocaleString('es-AR')}*\n\n¡Gracias! 😊`;
  const ph=cli.telefono?cli.telefono.replace(/\D/g,''):'543865860093';
  const url=`https://wa.me/${ph.startsWith('54')?ph:'54'+ph}?text=${encodeURIComponent(msg)}`;
  cart=[];updFab();cerrarCart();window.open(url,'_blank');
}
</script>
</body>
</html>
