<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Todo Golosina — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <style>
    :root {
      --primary: #1e293b;
      --accent: #fe3994;
      --bg: #f8f9fa;
      --surface: rgba(255, 255, 255, 0.8);
    }
    body {
      font-family: 'Outfit', sans-serif;
      background: linear-gradient(135deg, #f8f9fa 0%, #e2e8f0 100%);
      min-height: 100vh;
      color: #334155;
    }
    .glass-card {
      background: var(--surface);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 2rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      transition: transform 0.3s ease;
    }
    .glass-card:hover { transform: translateY(-5px); }
    .icon-box {
      width: 60px; height: 60px;
      border-radius: 1.5rem;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 1.5rem;
    }
    .btn-main {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: white;
      border: none;
      padding: 1.5rem 3rem;
      border-radius: 100px;
      font-weight: 900;
      font-size: 1.5rem;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 1rem;
    }
    .btn-main:hover {
      transform: scale(1.05);
      box-shadow: 0 20px 45px rgba(0,0,0,0.3);
      color: white;
    }
    .clock-text { font-size: 4rem; font-weight: 900; letter-spacing: -2px; }
    .metric-val { font-size: 2.5rem; font-weight: 800; line-height: 1; }
  </style>
</head>
<body class="d-flex align-items-center">

  <div class="container py-5">
    <!-- Header -->
    <div class="row mb-5 align-items-center">
      <div class="col-lg-6">
        <h5 class="text-accent fw-bold text-uppercase mb-2" style="letter-spacing: 4px;">Sistema de Gestión</h5>
        <h1 class="display-3 fw-black text-primary m-0">Todo Golosina</h1>
        <p class="fs-5 text-muted fw-medium mt-2">¡Bienvenido de nuevo, Exequiel!</p>
      </div>
      <div class="col-lg-6 text-lg-end">
        <div class="clock-text text-primary" id="liveClock">00:00:00</div>
        <div class="d-flex align-items-center justify-content-lg-end gap-3 mt-2">
          <i class="bi bi-cloud-sun fs-2 text-warning"></i>
          <span class="fs-4 fw-bold" id="weatherAguilares">--° - Aguilares</span>
        </div>
      </div>
    </div>

    <!-- Metrics Grid -->
    <div class="row g-4 mb-5">
      <div class="col-md-3">
        <div class="glass-card p-4 h-100">
          <div class="icon-box bg-primary bg-opacity-10 text-primary">
            <i class="bi bi-receipt-cutoff fs-2"></i>
          </div>
          <p class="text-muted fw-bold small text-uppercase mb-1">Tickets del Día</p>
          <div class="metric-val text-primary" id="valTickets">--</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="glass-card p-4 h-100">
          <div class="icon-box bg-success bg-opacity-10 text-success">
            <i class="bi bi-cash-coin fs-2"></i>
          </div>
          <p class="text-muted fw-bold small text-uppercase mb-1">Ventas Totales</p>
          <div class="metric-val text-success" id="valVentas">$0</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="glass-card p-4 h-100">
          <div class="icon-box bg-info bg-opacity-10 text-info">
            <i class="bi bi-people-fill fs-2"></i>
          </div>
          <p class="text-muted fw-bold small text-uppercase mb-1">Clientes Hoy</p>
          <div class="metric-val text-info" id="valClientes">--</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="glass-card p-4 h-100">
          <div class="icon-box bg-danger bg-opacity-10 text-danger">
            <i class="bi bi-exclamation-triangle-fill fs-2"></i>
          </div>
          <p class="text-muted fw-bold small text-uppercase mb-1">Alertas Stock</p>
          <div class="metric-val text-danger" id="valStock">--</div>
        </div>
      </div>
    </div>

    <!-- Action Button -->
    <div class="text-center mt-5">
      <a href="/facturador" class="btn-main">
        <i class="bi bi-plus-circle-fill"></i> NUEVA VENTA (F1)
      </a>
    </div>
  </div>

  <script>
    function updateDashboard() {
      const d = new Date();
      document.getElementById('liveClock').textContent = d.toLocaleTimeString('es-ES');
      
      // En este index, F1 redirige al facturador directamente
      window.onkeydown = function(e) {
        if (e.key === "F1") {
          e.preventDefault();
          window.location.href = "/facturador";
        }
      };

      // Fetch Metrics
      fetch('/api/ventas_hoy')
        .then(r => r.json())
        .then(d => {
          if (d.ok) {
            document.getElementById('valTickets').textContent = d.tickets_hoy;
            document.getElementById('valVentas').textContent = '$' + Number(d.total_ventas).toLocaleString();
            document.getElementById('valClientes').textContent = d.clientes_hoy;
            document.getElementById('valStock').textContent = d.alertas_stock;
          }
        });

      // Simple Weather Placeholder/Mock
      fetch("https://wttr.in/Aguilares,Tucuman?format=j1")
        .then(r => r.json())
        .then(data => {
          const current = data.current_condition[0];
          document.getElementById("weatherAguilares").textContent = current.temp_C + "° - Aguilares";
        }).catch(() => {});
    }

    setInterval(() => {
      const d = new Date();
      document.getElementById('liveClock').textContent = d.toLocaleTimeString('es-ES');
    }, 1000);
    
    updateDashboard();
  </script>
</body>
</html>
