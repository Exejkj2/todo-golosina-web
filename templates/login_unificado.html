<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Todo Golosina</title>
    <!-- Bootstrap para estilos base rápidos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Tipografía refinada -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            /* Degradado sutil y ejecutivo */
            background: linear-gradient(135deg, #1c1c1c 0%, #3a3a3a 100%);
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-title {
            font-weight: 600;
            color: #222;
            margin-bottom: 2rem;
            font-size: 1.4rem;
        }

        .form-control {
            border-radius: 8px;
            padding: 0.8rem 1rem;
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            font-size: 0.95rem;
        }

        .form-control:focus {
            box-shadow: none;
            border-color: #555;
        }

        .btn-login {
            background-color: #222;
            color: #fff;
            font-weight: 600;
            padding: 0.8rem;
            border-radius: 8px;
            width: 100%;
            border: none;
            transition: background-color 0.3s;
        }

        .btn-login:hover {
            background-color: #444;
            color: #fff;
        }

        .error-msg {
            color: #d9534f;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: block;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2 class="login-title">Bienvenido al Facturador de Todo Golosinas</h2>
        
        {% if error %}
            <span class="error-msg">{{ error }}</span>
        {% endif %}
        
        <form method="POST" action="/">
            <input type="text" class="form-control" name="usuario" placeholder="Usuario" required autocomplete="off">
            <input type="password" class="form-control" name="clave" placeholder="Contraseña" required>
            <button type="submit" class="btn btn-login mt-3">Ingresar al Sistema</button>
        </form>
    </div>

</body>
</html>
