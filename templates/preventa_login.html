<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso Preventista — Todo Golosina</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #2D3277 0%, #009EE3 100%);
    font-family: 'Segoe UI', sans-serif;
    padding: 1rem;
  }
  .login-card {
    background: #fff;
    border-radius: 20px;
    padding: 2.5rem 2rem;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
    text-align: center;
  }
  .login-icon {
    font-size: 3.5rem;
    margin-bottom: .5rem;
  }
  .login-card h2 {
    color: #2D3277;
    font-weight: 800;
    font-size: 1.3rem;
    margin-bottom: .3rem;
  }
  .login-card p {
    color: #64748b;
    font-size: .88rem;
    margin-bottom: 1.5rem;
  }
  .btn-acceder {
    background: linear-gradient(135deg, #2D3277, #009EE3);
    color: #fff;
    border: none;
    border-radius: 99px;
    padding: .7rem 2rem;
    font-weight: 700;
    font-size: 1rem;
    width: 100%;
    transition: transform .2s, box-shadow .2s;
  }
  .btn-acceder:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0,158,227,.4);
    color: #fff;
  }
</style>
</head>
<body>
  <div class="login-card">
    <div class="login-icon">🔐</div>
    <h2>Modo Preventista</h2>
    <p>Ingresá la contraseña para acceder al sistema de ventas externas.</p>

    {% if error %}
    <div class="alert alert-danger py-2 small fw-bold">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/preventa/login">
      <div class="mb-3">
        <input type="password" name="clave" class="form-control text-center fw-bold"
               placeholder="Contraseña" required autofocus
               style="border-radius: 12px; font-size: 1.1rem; letter-spacing: .15em;">
      </div>
      <button type="submit" class="btn btn-acceder">
        <i class="bi bi-unlock me-2"></i>Ingresar
      </button>
    </form>

    <a href="/" class="d-block mt-3 text-muted small text-decoration-none">
      <i class="bi bi-arrow-left"></i> Volver a la tienda
    </a>
  </div>
</body>
</html>
